function miPerLon(lat) { return 69.0 * Math.cos(lat * Math.PI / 180); }

const MAP_PW=MAP_RIGHT-MAP_LEFT, MAP_PH=MAP_BOTTOM-MAP_TOP;
const FULL_BOUNDS={minLon:-125.617,maxLon:-63.844,minLat:22.415,maxLat:49.546};
const M_MAX=0.998403, M_SPAN=0.596809; // pre-computed Mercator constants

function fullMercY(lat){return Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));}
function latLonToFrac(lat,lon){
  const xFrac=(lon-FULL_BOUNDS.minLon)/(FULL_BOUNDS.maxLon-FULL_BOUNDS.minLon);
  const yFrac=(M_MAX-fullMercY(lat))/M_SPAN;
  return{xFrac,yFrac};
}

const BASE_ICON="https://wsbylunv.neocities.org/yea/";

function normalizeCondition(str){
  if(!str)return"Cloudy";
  let s=String(str).toLowerCase().trim();
  s=s.replace(/\b(slight chance of|slight chance|chance of|chance|isolated|scattered|areas of|patchy|likely|and breezy|and windy)\b\s*/gi,"");
  s=s.replace(/\b(light|moderate|dense)\s+/gi,"");
  s=s.trim();
  if(/thunder|t-?storm/i.test(s))return"Thunderstorm";
  if(/tornado/i.test(s))return"Tornado";
  if(/blizzard|heavy.*snow|blowing snow/i.test(s))return"Heavy Snow";
  if(/snow.*shower|snow.*squall|flurr/i.test(s))return"Snow Showers";
  if(/(rain|shower).*snow|snow.*(rain|mix)|wintry/i.test(s))return"Rain/Snow Mix";
  if(/sleet|ice pellet/i.test(s))return"Sleet";
  if(/freezing rain/i.test(s))return"Freezing Rain";
  if(/snow/i.test(s))return"Snow";
  if(/heavy.*rain|heavy.*shower/i.test(s))return"Heavy Rain";
  if(/rain shower|shower|rain|drizzle/i.test(s))return"Rain Showers";
  if(/fog|mist/i.test(s))return"Foggy";
  if(/haze/i.test(s))return"Hazy";
  if(/partly sunny/i.test(s))return"Partly Sunny";
  if(/mostly sunny/i.test(s))return"Mostly Sunny";
  if(/partly cloudy/i.test(s))return"Partly Cloudy";
  if(/mostly cloudy/i.test(s))return"Mostly Cloudy";
  if(/mostly clear/i.test(s))return"Mostly Clear";
  if(/partly clear/i.test(s))return"Partly Clear";
  if(/sunny/i.test(s))return"Sunny";
  if(/clear|fair/i.test(s))return"Clear";
  if(/cloudy|overcast/i.test(s))return"Cloudy";
  return"Cloudy";
}

function getGifName(txt,isDay=true){
  const c=normalizeCondition(txt).toLowerCase();
  if(c==="thunderstorm")return BASE_ICON+"Thunderstorm (5-91).gif";
  if(c==="heavy snow")return BASE_ICON+"Heavy-Snow.gif";
  if(c==="snow showers")return BASE_ICON+"Light-Snow.gif";
  if(c==="rain/snow mix")return BASE_ICON+"Rain-Snow.gif";
  if(c==="sleet"||c==="freezing rain")return BASE_ICON+"Snow-Sleet.gif";
  if(c==="snow")return BASE_ICON+"Light-Snow.gif";
  if(c==="heavy rain")return BASE_ICON+"Rain.gif";
  if(c==="rain showers")return BASE_ICON+"Showers.gif";
  if(c==="foggy"||c==="hazy")return BASE_ICON+"Fog.gif";
  if(!isDay){
    if(c==="partly clear")return BASE_ICON+"Partly-Clear.gif";
    if(c==="mostly clear")return BASE_ICON+"Mostly-Clear.gif";
    if(c==="clear"||c==="sunny")return BASE_ICON+"Clear.gif";
    if(c==="partly cloudy"||c==="mostly sunny")return BASE_ICON+"Partly-Cloudy.gif";
    if(c==="mostly cloudy"||c==="partly sunny")return BASE_ICON+"Mostly-Cloudy-2.gif";
  } else {
    if(c==="mostly sunny")return BASE_ICON+"Partly-Cloudy.gif";
    if(c==="partly sunny")return BASE_ICON+"Mostly-Cloudy-2.gif";
    if(c==="partly cloudy")return BASE_ICON+"Partly-Cloudy.gif";
    if(c==="mostly cloudy")return BASE_ICON+"Mostly-Cloudy-2.gif";
    if(c==="mostly clear")return BASE_ICON+"Mostly-Sunny.gif";
    if(c==="sunny"||c==="clear")return BASE_ICON+"Sunny.gif";
  }
  return BASE_ICON+"Cloudy.gif";
}

function panBasemap(){
  const bm=document.getElementById("basemap");
  bm.style.backgroundImage="url('https://raw.githubusercontent.com/lunvyyrx23/ws4000byaqzzyx/main/Basemap2.png')";
  bm.style.backgroundSize=`${MAP_PW}px ${MAP_PH}px`;
  bm.style.backgroundPosition=`${MAP_LEFT}px ${MAP_TOP}px`;
  bm.style.backgroundRepeat="no-repeat";
}

function drawDots(cities){
  const dotsDiv=document.getElementById("dots");
  dotsDiv.innerHTML="";
  function toScreen(lat,lon){
    const{xFrac,yFrac}=latLonToFrac(lat,lon);
    const x=MAP_LEFT+xFrac*MAP_PW;
    const y=MAP_TOP+yFrac*MAP_PH;
    return{x,y};
  }
  cities.forEach(city=>{
    let{x,y}=toScreen(city.lat,city.lon);
    const off=MANUAL_OFFSETS[city.name];
    if(off?.x!==undefined){x=off.x;y=off.y;}
    if(off?.pyOffset)y+=off.pyOffset;
    if(x<MAP_LEFT+5||x>MAP_RIGHT-5||y<MAP_TOP+5||y>MAP_BOTTOM-5)return;
    const el=document.createElement("div");
    el.style.cssText=`position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:4;`;
    el.innerHTML=`
      <div style="width:6px;height:6px;background:#fff;border-radius:50%;border:1.5px solid #000;flex-shrink:0;"></div>
      <img src="${city.icon}" style="width:36px;height:auto;image-rendering:pixelated;margin-top:1px;">
      <div style="color:#ffff00;font-size:13px;white-space:nowrap;line-height:1;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;">${city.temp}</div>
      <div style="color:#fff;font-size:10px;white-space:nowrap;line-height:1;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;">${city.name}</div>
    `;
    dotsDiv.appendChild(el);
  });
}

async function init(){
  panBasemap();
  const results=[];
  for(let i=0;i<REG_CITIES.length;i+=6){
    const batch=REG_CITIES.slice(i,i+6);
    const br=await Promise.all(batch.map(async city=>{
      try{
        const p=await fetch(`https://api.weather.gov/points/${city.lat},${city.lon}`).then(r=>r.json());
        const fh=p?.properties?.forecastHourly;
        if(!fh)throw new Error();
        const f=await fetch(fh).then(r=>r.json());
        const now=f?.properties?.periods?.[0];
        const temp=now?.temperature!=null?now.temperature+"°":"--";
        const isDay=now?.isDaytime!==undefined?!!now.isDaytime:true;
        const icon=getGifName(now?.shortForecast||"",isDay);
        return{...city,temp,icon};
      }catch{
        return{...city,temp:"--",icon:getGifName("Cloudy",true)};
      }
    }));
    results.push(...br);
    drawDots(results);
  }
}

init();
