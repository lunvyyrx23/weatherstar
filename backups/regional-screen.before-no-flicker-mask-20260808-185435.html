      function milesPerLon(lat) {
        return Math.max(1, MILES_PER_LAT * Math.cos((lat * Math.PI) / 180));
      }

      function distanceMiles(aLat, aLon, bLat, bLon) {
        const dLat = ((bLat - aLat) * Math.PI) / 180;
        const dLon = ((bLon - aLon) * Math.PI) / 180;
        const lat1 = (aLat * Math.PI) / 180;
        const lat2 = (bLat * Math.PI) / 180;

        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;

        return 3958.8 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      function getBounds(center) {
        const latRange = HALF_VIEW_MILES / MILES_PER_LAT;
        const lonRange = HALF_VIEW_MILES / milesPerLon(center.lat);

        return {
          minLat: center.lat - latRange,
          maxLat: center.lat + latRange,
          minLon: center.lon - lonRange,
          maxLon: center.lon + lonRange
        };
      }

      async function geocodeLocation(place) {
        const url =
          "https://geocoding-api.open-meteo.com/v1/search" +
          "?name=" + encodeURIComponent(place) +
          "&count=1&language=en&format=json";

        const data = await fetch(url).then(r => r.json());
        const hit = data?.results?.find(r => r.country_code === "US") || data?.results?.[0];

        if (!hit) {
          return { lat: 33.4735, lon: -82.0105 };
        }

        return {
          lat: Number(hit.latitude),
          lon: Number(hit.longitude)
        };
      }

      function getCitiesInsideArea(center) {
        const bounds = getBounds(center);

        const areaCities = cities
          .map(city => ({
            ...city,
            distance: distanceMiles(center.lat, center.lon, city.lat, city.lon)
          }))
          .filter(city =>
            city.lat >= bounds.minLat &&
            city.lat <= bounds.maxLat &&
            city.lon >= bounds.minLon &&
            city.lon <= bounds.maxLon
          )
          .sort((a, b) => a.distance - b.distance);

        if (selectedCityDot) {
          const alreadyThere = areaCities.some(city =>
            distanceMiles(selectedCityDot.lat, selectedCityDot.lon, city.lat, city.lon) < 15
          );

          if (!alreadyThere) {
            areaCities.unshift({
              ...selectedCityDot,
              distance: 0,
              selected: true
            });
          }
        }

        return areaCities;
      }

      function formatCityName(name) {
        return String(name || "")
          .toLowerCase()
          .split(" ")
          .map(part => {
            if (part === "dc") return "DC";
            if (part === "az") return "AZ";
            if (part === "ga") return "GA";
            if (part === "fl") return "FL";
            if (part === "sc") return "SC";
            if (part === "nc") return "NC";
            if (part === "tn") return "TN";
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(" ");
      }

      function drawDots() {
        window.redrawDots = drawDots;
        const MIN_DOT_SCREEN_DISTANCE = Number(window.wsDotEditor?.dotSpacing || 129);
        const SAFE_DOT_TOP = 80;
        const SAFE_DOT_BOTTOM = 760;

        const projected = currentCities
          .map(city => {
            const point = map.project([city.lon, city.lat]);
            const priority = cities.findIndex(item => item.name === city.name);

            return {
              ...city,
              point,
              priority: city.selected ? -9999 : priority
            };
          })
          .filter(city =>
            Number.isFinite(city.point.x) &&
            Number.isFinite(city.point.y) &&
            city.point.y >= SAFE_DOT_TOP &&
            city.point.y <= SAFE_DOT_BOTTOM
          )
          .sort((a, b) => {
            if (a.selected && !b.selected) return -1;
            if (!a.selected && b.selected) return 1;

            const ap = a.priority < 0 ? 9999 : a.priority;
            const bp = b.priority < 0 ? 9999 : b.priority;

            return ap - bp;
          });

        const kept = [];

        projected.forEach(city => {
          const tooClose = kept.some(other => {
            const dx = city.point.x - other.point.x;
            const dy = city.point.y - other.point.y;
            const screenDistance = Math.sqrt(dx * dx + dy * dy);

            return screenDistance < MIN_DOT_SCREEN_DISTANCE;
          });

          if (!tooClose) {
            kept.push(city);
          }
        });

        dots.innerHTML = kept
          .map((city, index) => {
            const point = city.point;
            const temp = 72 + ((index * 3) % 18);

            return `
              <div class="city-dot" data-city="${city.name}" style="left:${Math.round(point.x)}px; top:${Math.round(point.y)}px;">
                <div class="temp">${temp}°</div>
                <div class="name">${formatCityName(city.name)}</div>
              </div>
            `;
          })
          .join("");

        status.innerText = "Dots shown: " + kept.length + " / " + currentCities.length;
      }

      async function showArea() {
        const place = document.getElementById("locationInput").value || "Augusta, GA";
        status.innerText = "Loading area...";

        const center = await geocodeLocation(place);
        selectedCityDot = {
          name: place.split(",")[0].trim().toUpperCase(),
          lat: center.lat,
          lon: center.lon
        };
        const bounds = getBounds(center);

        currentCities = getCitiesInsideArea(center);

        map.fitBounds(
          [
            [bounds.minLon, bounds.minLat],
            [bounds.maxLon, bounds.maxLat]
          ],
          {
            padding: 0,
            duration: 0
          }
        );

        setTimeout(() => {
          drawDots();
          status.innerText = "Dots loaded: " + currentCities.length;
        }, 300);
      }

      try {
        status.innerText = "Importing MapLibre...";
        const mod = await import("maplibre-gl");
        const maplibregl = mod.default || mod;

        status.innerText = "Starting map...";

        const styleResponse = await fetch(MAPTILER_JSON_URL);
        const style = await styleResponse.json();

        map = new maplibregl.Map({
          container: "map",
          style,
          center: [-82.0105, 33.4735],
          zoom: 6,
          interactive: false,
          attributionControl: false
        });

        map.on("load", () => {
          status.innerText = "Map loaded";
          showArea();
        });

        map.on("moveend", drawDots);

        document.getElementById("goBtn").addEventListener("click", showArea);
      } catch (err) {
        console.error(err);
        status.innerText = "ERROR: " + err.message;
      }
    </script>

    <script id="dotEditorScript">
      (function () {
        const saved = JSON.parse(localStorage.getItem("wsDotEditor") || "{}");

        const settings = {
          tempFont: saved.tempFont || "Star4000",
          nameFont: saved.nameFont || "Star4000Extended",
          tempSize: saved.tempSize || 35,
          nameSize: saved.nameSize || 20,
          labelGap: saved.labelGap ?? 1,
          dotSpacing: saved.dotSpacing || 80
        };

        window.wsDotEditor = settings;

        const root = document.documentElement;

        function setValue(id, value) {
          const el = document.getElementById(id);
          if (el) el.value = value;
        }

        function applyEditor() {
          root.style.setProperty("--dot-temp-font", '"' + settings.tempFont + '"');
          root.style.setProperty("--dot-name-font", '"' + settings.nameFont + '"');
          root.style.setProperty("--dot-temp-size", settings.tempSize + "px");
          root.style.setProperty("--dot-name-size", settings.nameSize + "px");
          root.style.setProperty("--dot-temp-line", Math.round(settings.tempSize * .9) + "px");
          root.style.setProperty("--dot-name-line", Math.round(settings.nameSize * .95) + "px");
          root.style.setProperty("--dot-label-gap", settings.labelGap + "px");
          root.style.setProperty("--dot-text-blur", settings.textBlur + "px");

          localStorage.setItem("wsDotEditor", JSON.stringify(settings));

          if (window.redrawDots) {
            window.redrawDots();
          }
        }

        function bind(id, key, isNumber) {
          const el = document.getElementById(id);
          if (!el) return;

          el.addEventListener("input", () => {
            settings[key] = isNumber ? Number(el.value) : el.value;
            window.wsDotEditor = settings;
            applyEditor();
          });
        }

        setValue("tempFontPick", settings.tempFont);
        setValue("nameFontPick", settings.nameFont);
        setValue("tempSizePick", settings.tempSize);
        setValue("nameSizePick", settings.nameSize);
        setValue("labelGapPick", settings.labelGap);
        setValue("dotSpacingPick", settings.dotSpacing);
        setValue("textBlurPick", settings.textBlur);

        bind("tempFontPick", "tempFont", false);
        bind("nameFontPick", "nameFont", false);
        bind("tempSizePick", "tempSize", true);
        bind("nameSizePick", "nameSize", true);
        bind("labelGapPick", "labelGap", true);
        bind("dotSpacingPick", "dotSpacing", true);
        bind("textBlurPick", "textBlur", true);

        document.addEventListener("click", (event) => {
          const dot = event.target.closest(".city-dot");
          if (!dot) return;

          document.querySelectorAll(".city-dot").forEach(el => {
            el.classList.remove("selected-dot");
          });

          dot.classList.add("selected-dot");

          const name = dot.dataset.city || dot.querySelector(".name")?.textContent || "selected";
          document.getElementById("selectedDotName").textContent = name;
        });

        applyEditor();
      })();
    </script>

<script id="dotExportScript">

      const btn = document.createElement("button");
      btn.id = "exportDotSettingsBtn";
      btn.textContent = "Export Settings";
      btn.style.width = "100%";
      btn.style.marginTop = "10px";
      btn.style.padding = "8px";
      btn.style.background = "#ffff00";
      btn.style.color = "#000";
      btn.style.border = "0";
      btn.style.fontWeight = "bold";
      btn.style.cursor = "pointer";

      btn.addEventListener("click", function () {
        const visibleDots = Array.from(document.querySelectorAll(".city-dot")).map(dot => ({
          city: dot.dataset.city || dot.querySelector(".name")?.textContent || "",
          left: dot.style.left,
          top: dot.style.top,
          temp: dot.querySelector(".temp")?.textContent || "",
          name: dot.querySelector(".name")?.textContent || ""
        }));

        const exportData = {
          exportedAt: new Date().toISOString(),
          project: "WeatherSTAR Regional Map",
          settings: window.wsDotEditor || JSON.parse(localStorage.getItem("wsDotEditor") || "{}"),
          visibleDots,
          note: "These settings are global. Temp font changes apply to all temperatures. City font changes apply to all city names."
        };

        const blob = new Blob([JSON.stringify(exportData, null, 2)], {
          type: "application/json"
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "weatherstar-regional-dot-settings.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      editor.appendChild(btn);
    }

    addExportButton();
    document.addEventListener("DOMContentLoaded", addExportButton);
    setTimeout(addExportButton, 500);
  })();

<script id="regionalCollisionMask">
(() => {
  const BANNER_TOP = 689;
  const BANNER_LEFT = 0;
  const BANNER_RIGHT = 1091;
  const FRAME_ALPHA_THRESHOLD = 24;

  let frameMask = null;

  function firstExisting(selectors) {
    for (const selector of selectors) {
      const el = document.querySelector(selector);
      if (el) return el;
    }
    return null;
  }

  function getScreen() {
    return firstExisting(["#screen", "#scr", ".screen"]) || document.body;
  }

  function getDotsLayer() {
    return firstExisting(["#dots", "#regional-dots", ".dots"]);
  }

  function getFrameImage() {
    return firstExisting([
      "#regional-frame-img",
      "img[src*='ws4000wherediditgo']",
      "#regional-frame img",
      "#frame img"
    ]);
  }

  function intersects(a, b) {
    return (
      a.left < b.right &&
      a.right > b.left &&
      a.top < b.bottom &&
      a.bottom > b.top
    );
  }

  function touchesBottomBanner(dot) {
    const screen = getScreen();
    const s = screen.getBoundingClientRect();
    const r = dot.getBoundingClientRect();

    const banner = {
      left: s.left + BANNER_LEFT,
      right: s.left + BANNER_RIGHT,
      top: s.top + BANNER_TOP,
      bottom: s.bottom
    };

    return intersects(r, banner);
  }

  function buildFrameMask() {
    const img = getFrameImage();

    if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) {
      return null;
    }

    if (
      frameMask &&
      frameMask.img === img &&
      frameMask.w === img.naturalWidth &&
      frameMask.h === img.naturalHeight
    ) {
      return frameMask;
    }

    const canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    try {
      ctx.drawImage(img, 0, 0);
    } catch (e) {
      return null;
    }

    let transparent = 0;
    let opaque = 0;

    for (let y = 0; y < canvas.height; y += 40) {
      for (let x = 0; x < canvas.width; x += 40) {
        const alpha = ctx.getImageData(x, y, 1, 1).data[3];
        if (alpha < 10) transparent++;
        if (alpha > 220) opaque++;
      }
    }

    frameMask = {
      img,
      canvas,
      ctx,
      w: canvas.width,
      h: canvas.height,
      usableAlphaMask: transparent > 5 && opaque > 5
    };

    return frameMask;
  }

  function touchesRegionalImage(dot) {
    const mask = buildFrameMask();

    if (!mask || !mask.usableAlphaMask) return false;

    const imgRect = mask.img.getBoundingClientRect();
    const dotRect = dot.getBoundingClientRect();

    if (!intersects(dotRect, imgRect)) return false;

    const left = Math.max(dotRect.left, imgRect.left);
    const right = Math.min(dotRect.right, imgRect.right);
    const top = Math.max(dotRect.top, imgRect.top);
    const bottom = Math.min(dotRect.bottom, imgRect.bottom);

    for (let y = top; y <= bottom; y += 4) {
      for (let x = left; x <= right; x += 4) {
        const px = Math.max(
          0,
          Math.min(mask.w - 1, Math.floor(((x - imgRect.left) / imgRect.width) * mask.w))
        );

        const py = Math.max(
          0,
          Math.min(mask.h - 1, Math.floor(((y - imgRect.top) / imgRect.height) * mask.h))
        );

        const alpha = mask.ctx.getImageData(px, py, 1, 1).data[3];

        if (alpha > FRAME_ALPHA_THRESHOLD) {
          return true;
        }
      }
    }

    return false;
  }

  function applyRegionalCollisionMask() {
    const dots = Array.from(document.querySelectorAll(".city-dot, .regional-dot"));

    if (!dots.length) return;

    const checks = dots.map(dot => ({
      dot,
      banner: touchesBottomBanner(dot),
      frame: touchesRegionalImage(dot)
    }));

    const frameHits = checks.filter(item => item.frame).length;

    /*
      Safety check:
      If the PNG is not a transparent overlay and the mask thinks almost every
      dot touches the image, ignore image masking so it does not erase the map.
    */
    const useFrameMask = frameHits > 0 && frameHits < dots.length * 0.75;

    checks.forEach(item => {
      const hide = item.banner || (useFrameMask && item.frame);
      item.dot.classList.toggle("hidden-by-regional-mask", hide);
    });
  }

  function startRegionalCollisionMask() {
    const layer = getDotsLayer();

    if (layer && !layer.dataset.regionalCollisionObserver) {
      const observer = new MutationObserver(() => {
        requestAnimationFrame(applyRegionalCollisionMask);
      });

      observer.observe(layer, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["style", "class"]
      });

      layer.dataset.regionalCollisionObserver = "true";
    }

    requestAnimationFrame(applyRegionalCollisionMask);
    setTimeout(applyRegionalCollisionMask, 250);
    setTimeout(applyRegionalCollisionMask, 750);
  }

  window.addEventListener("load", startRegionalCollisionMask);
  window.addEventListener("resize", applyRegionalCollisionMask);
  document.addEventListener("DOMContentLoaded", startRegionalCollisionMask);

  setInterval(startRegionalCollisionMask, 1000);
})();
</script>
