      let map;
      let currentCities = [];
      let selectedCityDot = null;

      function milesPerLon(lat) {
        return Math.max(1, MILES_PER_LAT * Math.cos((lat * Math.PI) / 180));
      }

      function distanceMiles(aLat, aLon, bLat, bLon) {
        const dLat = ((bLat - aLat) * Math.PI) / 180;
        const dLon = ((bLon - aLon) * Math.PI) / 180;
        const lat1 = (aLat * Math.PI) / 180;
        const lat2 = (bLat * Math.PI) / 180;

        const h =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;

        return 3958.8 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
      }

      function getBounds(center) {
        const latRange = HALF_VIEW_MILES / MILES_PER_LAT;
        const lonRange = HALF_VIEW_MILES / milesPerLon(center.lat);

        return {
          minLat: center.lat - latRange,
          maxLat: center.lat + latRange,
          minLon: center.lon - lonRange,
          maxLon: center.lon + lonRange
        };
      }

      async function geocodeLocation(place) {
        const url =
          "https://geocoding-api.open-meteo.com/v1/search" +
          "?name=" + encodeURIComponent(place) +
          "&count=1&language=en&format=json";

        const data = await fetch(url).then(r => r.json());
        const hit = data?.results?.find(r => r.country_code === "US") || data?.results?.[0];

        if (!hit) {
          return { lat: 33.4735, lon: -82.0105 };
        }

        return {
          lat: Number(hit.latitude),
          lon: Number(hit.longitude)
        };
      }

      function getCitiesInsideArea(center) {
        const bounds = getBounds(center);

        const areaCities = cities
          .map(city => ({
            ...city,
            distance: distanceMiles(center.lat, center.lon, city.lat, city.lon)
          }))
          .filter(city =>
            city.lat >= bounds.minLat &&
            city.lat <= bounds.maxLat &&
            city.lon >= bounds.minLon &&
            city.lon <= bounds.maxLon
          )
          .sort((a, b) => a.distance - b.distance);

        if (selectedCityDot) {
          const alreadyThere = areaCities.some(city =>
            distanceMiles(selectedCityDot.lat, selectedCityDot.lon, city.lat, city.lon) < 15
          );

          if (!alreadyThere) {
            areaCities.unshift({
              ...selectedCityDot,
              distance: 0,
              selected: true
            });
          }
        }

        return areaCities;
      }

      function formatCityName(name) {
        return String(name || "")
          .toLowerCase()
          .split(" ")
          .map(part => {
            if (part === "dc") return "DC";
            if (part === "az") return "AZ";
            if (part === "ga") return "GA";
            if (part === "fl") return "FL";
            if (part === "sc") return "SC";
            if (part === "nc") return "NC";
            if (part === "tn") return "TN";
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(" ");
      }

      function drawDots() {
        window.redrawDots = drawDots;
        const MIN_DOT_SCREEN_DISTANCE = Number(window.wsDotEditor?.dotSpacing || 95);
        const SAFE_DOT_TOP = 80;
        const SAFE_DOT_BOTTOM = 635;

        const projected = currentCities
          .map(city => {
            const point = map.project([city.lon, city.lat]);
            const priority = cities.findIndex(item => item.name === city.name);

            return {
              ...city,
              point,
              priority: city.selected ? -9999 : priority
            };
          })
          .filter(city =>
            Number.isFinite(city.point.x) &&
            Number.isFinite(city.point.y) &&
            city.point.y >= SAFE_DOT_TOP &&
            city.point.y <= 635
          )
          .sort((a, b) => {
            if (a.selected && !b.selected) return -1;
            if (!a.selected && b.selected) return 1;

            const ap = a.priority < 0 ? 9999 : a.priority;
            const bp = b.priority < 0 ? 9999 : b.priority;

            return ap - bp;
          });

        const kept = [];

        projected.forEach(city => {
          const tooClose = kept.some(other => {
            const dx = city.point.x - other.point.x;
            const dy = city.point.y - other.point.y;
            const screenDistance = Math.sqrt(dx * dx + dy * dy);

            return screenDistance < MIN_DOT_SCREEN_DISTANCE;
          });

          if (!tooClose) {
            kept.push(city);
          }
        });

        dots.innerHTML = kept
          .map((city, index) => {
            const point = city.point;
            const temp = 72 + ((index * 3) % 18);

            return `
              <div class="regional-dot" data-city="${city.name}" style="left:${Math.round(point.x)}px; top:${Math.round(point.y)}px;">
                <div class="regional-temp">${temp}°</div>
                <img class="regional-weather-icon" src="/icons/cc/RegionalSunny.gif?v=1" alt="">
                
                <div class="regional-name">${formatCityName(city.name)}</div>
              </div>
            `;
          })
          .join("");

        status.innerText = "Dots shown: " + kept.length + " / " + currentCities.length;
      }

      async function showArea() {
        const place = document.getElementById("locationInput").value || "Augusta, GA";
        status.innerText = "Loading area...";

        const center = await geocodeLocation(place);
        selectedCityDot = {
          name: place.split(",")[0].trim().toUpperCase(),
          lat: center.lat,
          lon: center.lon
        };
        const bounds = getBounds(center);

        currentCities = getCitiesInsideArea(center);

        map.fitBounds(
          [
            [bounds.minLon, bounds.minLat],
            [bounds.maxLon, bounds.maxLat]
          ],
          {
            padding: 0,
            duration: 0
          }
        );

        setTimeout(() => {
          drawDots();
          status.innerText = "Dots loaded: " + currentCities.length;
        }, 300);
      }

      try {
        status.innerText = "Importing MapLibre...";
        const mod = await import("maplibre-gl");
        const maplibregl = mod.default || mod;

        status.innerText = "Starting map...";

        const styleResponse = await fetch(MAPTILER_JSON_URL);
        const style = await styleResponse.json();

        map = new maplibregl.Map({
          container: "map",
          style,
          center: [-82.0105, 33.4735],
          zoom: 6,
          interactive: false,
          attributionControl: false
        });

        map.on("load", () => {
          status.innerText = "Map loaded";
          showArea();
        });

        map.on("moveend", drawDots);

        document.getElementById("goBtn").addEventListener("click", showArea);
      } catch (err) {
        console.error(err);
        status.innerText = "ERROR: " + err.message;
      }
    </script>
  









<script id="regionalParentSearchBridge">
(() => {
  function setRegionalLocation(place) {
    if (!place || !String(place).trim()) return;

    const value = String(place).trim();

    [
      "locationInput",
      "placeInput",
      "searchInput",
      "cityInput",
      "city-input",
      "regional-search"
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    });

    const btn =
      document.getElementById("goBtn") ||
      document.getElementById("regional-go") ||
      document.querySelector("button[data-action='search']");

    if (btn) {
      btn.click();
      return;
    }

    if (typeof window.showArea === "function") {
      window.showArea(value);
    }
  }

  function readUrlLocation() {
    const params = new URLSearchParams(window.location.search);
    return params.get("location") || params.get("city") || "";
  }

  window.addEventListener("message", event => {
    if (event.data && event.data.type === "weatherstar:setRegionalLocation") {
      setRegionalLocation(event.data.location);
    }
  });

  window.addEventListener("load", () => {
    const place = readUrlLocation();
    if (!place) return;

    setTimeout(() => setRegionalLocation(place), 100);
    setTimeout(() => setRegionalLocation(place), 500);
    setTimeout(() => setRegionalLocation(place), 1000);
  });
})();
</script>
